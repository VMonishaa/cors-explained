<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under the Hood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Lora:ital,wght@0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAF8;
    --ink: #1A1A18;
    --ink-2: #4A4A46;
    --ink-3: #888780;
    --accent: #1D9E75;
    --rule: #E8E6DF;
    --serif: 'Lora', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .page { max-width: 680px; margin: 0 auto; padding: 5rem 2rem 6rem; }

  .intro { margin-bottom: 4rem; }
  .intro-label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .intro-label::before { content: ''; display: block; width: 20px; height: 1.5px; background: var(--accent); }
  .intro h1 {
    font-family: var(--serif);
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    font-weight: 600;
    color: var(--ink);
    line-height: 1.25;
    margin-bottom: 1rem;
    letter-spacing: -.01em;
  }
  .intro p { font-size: 1rem; color: var(--ink-2); max-width: 480px; line-height: 1.65; }

  .posts-label { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 1.25rem; }

  .post-list { display: flex; flex-direction: column; }

  .post-item {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    gap: 1rem;
    padding: 1.4rem 0;
    border-bottom: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
    transition: opacity .15s;
  }
  .post-item:first-child { border-top: 1px solid var(--rule); }
  .post-item:hover { opacity: .65; }
  .post-item:hover .post-arrow { transform: translateX(4px); }

  .post-tag { font-size: 11px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  .post-title { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; color: var(--ink); line-height: 1.3; margin-bottom: 6px; }
  .post-desc { font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }
  .post-meta { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--ink-3); }
  .post-meta-dot { width: 2px; height: 2px; border-radius: 50%; background: var(--rule); }

  .post-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding-top: 2px; flex-shrink: 0; }
  .post-date { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .post-arrow { font-size: 16px; color: var(--ink-3); transition: transform .15s; line-height: 1; }

  footer { margin-top: 5rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-3); }

  @media (max-width: 520px) {
    .page { padding: 3rem 1.25rem 4rem; }
    .post-item { grid-template-columns: 1fr; }
    .post-right { flex-direction: row; align-items: center; }
    .post-arrow { display: none; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="intro">
    <div class="intro-label">Under the Hood</div>
    <h1>What's actually<br>going on in there.</h1>
    <p>Deep dives into web development, backend engineering, and security — written the way I wish someone had explained them to me.</p>
  </div>

  <div class="posts-label">All posts</div>
  <div class="post-list" id="post-list"></div>

</div>

<script src="posts.js"></script>
<script>
  const list = document.getElementById('post-list');

  POSTS.forEach(post => {
    list.innerHTML += `
      <a class="post-item" href="/${post.file}" target="_blank" rel="noopener noreferrer">
        <div class="post-body">
          <div class="post-tag">${post.tag}</div>
          <div class="post-title">${post.title}</div>
          <div class="post-desc">${post.desc}</div>
          <div class="post-meta">
            <span>${post.date}</span>
            <span class="post-meta-dot"></span>
            <span>${post.read} read</span>
          </div>
        </div>
        <div class="post-right">
          <span class="post-date">${post.date}</span>
          <span class="post-arrow">→</span>
        </div>
      </a>`;
  });
</script>
</body>
</html>
